name: 📝 Reportar un Problema
description: Reporta errores en los materiales del curso MAT281.
title: "[BUG] Breve descripción del problema"
labels: ["bug"]
assignees:
  - fralfaro

body:
  - type: markdown
    attributes:
      value: "Gracias por ayudarnos a mejorar el curso MAT281. Completa la siguiente información para entender mejor tu solicitud."

  - type: textarea
    id: descripcion
    attributes:
      label: "📋 Descripción del Problema"
      description: "¿Qué error encontraste? Explica de manera clara y breve."
      placeholder: "Describe el problema aquí..."
    validations:
      required: true

  - type: checkboxes
    id: ubicacion
    attributes:
      label: "📖 Ubicación del Error"
      description: "¿Dónde ocurre el problema?"
      options:
        - label: "📓 Jupyter Notebook"
        - label: "📄 Archivo Markdown"
        - label: "🔄 Otro (especificar en la información adicional)"

  - type: input
    id: archivo
    attributes:
      label: "📌 Nombre del archivo"
      placeholder: "Ejemplo: notebooks/tema1.ipynb"

  - type: textarea
    id: comportamiento
    attributes:
      label: "✅ Comportamiento Esperado"
      description: "Describe cómo debería funcionar correctamente."
      placeholder: "Ejemplo: El código debería devolver X, pero devuelve Y."
    validations:
      required: false

  - type: textarea
    id: evidencia
    attributes:
      label: "🔍 Evidencia (Opcional)"
      description: "Adjunta capturas de pantalla o fragmentos de código relevantes."
      placeholder: "Puedes arrastrar imágenes o pegar código aquí..."
    validations:
      required: false

  - type: textarea
    id: informacion_adicional
    attributes:
      label: "🖥️ Información Adicional (Opcional)"
      description: "Si el problema depende del entorno, indica la versión de Jupyter/Colab y cualquier otro detalle relevante."
      placeholder: "Ejemplo: Google Colab - Python 3.9"
    validations:
      required: false

  - type: markdown
    attributes:
      value: "💡 **¿Quieres ayudar a solucionar este problema?** Si tienes una solución, abre un [Pull Request](https://github.com/fralfaro/MAT281/pulls) con los cambios sugeridos. ¡Tu aporte es bienvenido! 🚀"
